<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face · 页面逻辑原型 v2</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --line:#e3e7ee; --text:#1c2532; --sub:#5a6574;
    --muted:#8b95a5; --accent:#2563eb; --accent-bg:#eef3ff; --ok:#15803d; --ok-bg:#eaf6ee;
    --warn:#96600c; --warn-bg:#fff8e9; --warn-line:#f0c77a; --danger:#b42318;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px -12px rgba(16,24,40,.12);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.6 "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  a{color:inherit;text-decoration:none}
  button{font:inherit;cursor:pointer}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px}

  /* 顶栏 */
  header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .top-in{display:flex;align-items:center;gap:24px;height:60px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
  .logo b{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;
    background:var(--accent);color:#fff;font-size:15px}
  .logo small{font-weight:400;color:var(--muted);font-size:12px}
  nav.main{display:flex;gap:4px;margin-left:8px}
  nav.main a{padding:7px 14px;border-radius:8px;color:var(--sub);font-size:13.5px}
  nav.main a:hover{background:#f0f2f6}
  nav.main a.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
  .right{margin-left:auto;display:flex;align-items:center;gap:10px;position:relative}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-bg);
    color:var(--accent);display:grid;place-items:center;font-weight:700;cursor:pointer;
    border:1px solid #d5e2ff}
  .menu{position:absolute;right:0;top:44px;background:#fff;border:1px solid var(--line);
    border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:168px;display:none}
  .menu.open{display:block}
  .menu a,.menu button{display:block;width:100%;text-align:left;padding:9px 12px;border:0;
    background:none;border-radius:8px;color:var(--text);font-size:13.5px}
  .menu a:hover,.menu button:hover{background:#f5f7fa}
  .menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}

  /* 通用 */
  main{padding:32px 0 72px;min-height:calc(100vh - 60px)}
  h1{font-size:26px;line-height:1.35;margin:0 0 8px;letter-spacing:-.01em}
  h2{font-size:16px;margin:0 0 4px}
  h3{font-size:14px;margin:0}
  p{margin:0;color:var(--sub)}
  .lead{color:var(--sub);margin-bottom:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;
    box-shadow:var(--shadow)}
  .grid{display:grid;gap:16px}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:1.6fr 1fr}
  .row{display:flex;align-items:center;gap:12px}
  .spread{display:flex;align-items:center;justify-content:space-between;gap:16px}
  .muted{color:var(--muted);font-size:12.5px}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;
    font-size:12px;background:#f1f3f7;color:var(--sub)}
  .pill.ok{background:var(--ok-bg);color:var(--ok)}
  .pill.warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}
  .pill.blue{background:var(--accent-bg);color:var(--accent)}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:9px;
    border:1px solid var(--line);background:#fff;color:var(--text);font-size:13.5px}
  .btn:hover{background:#f7f8fa}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--sub)}
  .btn.danger{color:var(--danger);border-color:#f2c8c3}
  .arrow:after{content:"→";margin-left:2px}
  .divider{height:1px;background:var(--line);margin:16px 0}
  .empty{padding:36px;text-align:center;border:1px dashed #cfd6e2;border-radius:14px;background:#fbfcfd}

  /* 工作台 */
  .hero{background:linear-gradient(180deg,#fff,#fbfcff);border:1px solid var(--line);
    border-radius:16px;padding:28px;box-shadow:var(--shadow);margin-bottom:16px}
  .hero .row{margin-top:18px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
  .stat b{display:block;font-size:22px;margin:6px 0 2px}
  .list{display:flex;flex-direction:column}
  .item{display:flex;align-items:center;gap:14px;padding:14px 4px;border-top:1px solid var(--line)}
  .item:first-child{border-top:0}
  .dot{width:8px;height:8px;border-radius:50%;background:#c9d2e0;flex:none}
  .dot.on{background:var(--accent)}

  /* 个人中心 */
  .me{display:grid;grid-template-columns:210px 1fr;gap:24px}
  .side{position:sticky;top:84px;align-self:start}
  .side a{display:block;padding:9px 12px;border-radius:9px;color:var(--sub);font-size:13.5px}
  .side a:hover{background:#f0f2f6}
  .side a.on{background:#fff;border:1px solid var(--line);color:var(--text);font-weight:600;
    box-shadow:var(--shadow)}
  .side .grp{margin:18px 4px 6px;font-size:11.5px;color:var(--muted);letter-spacing:.04em}

  /* 表单 */
  label.f{display:block;font-size:12.5px;color:var(--sub);margin:0 0 6px}
  input[type=text],input[type=password],textarea,select{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;
    background:#fff;color:var(--text)}
  textarea{min-height:140px;resize:vertical}
  input:focus,textarea:focus{outline:2px solid #cfe0ff;border-color:#a9c6ff}
  .field{margin-bottom:16px}

  /* 权重滑块 */
  .wrow{display:grid;grid-template-columns:130px 1fr 44px;align-items:center;gap:14px;padding:7px 0}
  input[type=range]{width:100%;accent-color:var(--accent)}

  /* 作答 */
  .qhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .qtext{font-size:19px;line-height:1.55;font-weight:600;margin:6px 0 10px}
  .progress{height:6px;background:#eaeef4;border-radius:99px;overflow:hidden;flex:1}
  .progress i{display:block;height:100%;background:var(--accent);border-radius:99px}

  /* 报告 */
  .score{font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .dim{display:grid;grid-template-columns:96px 1fr 46px;align-items:center;gap:12px;padding:7px 0}
  .bar{height:8px;background:#eef1f6;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
  .bar i.off{background:#dfe4ec}
  .dedu{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fcfcfd}
  .dedu .t{display:flex;justify-content:space-between;gap:10px;font-weight:600}
  .dedu .e{font-size:12.5px;color:var(--sub);margin-top:4px}

  /* 记录 */
  .hrow{display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:center;
    padding:16px 4px;border-top:1px solid var(--line)}
  .hrow:first-child{border-top:0}
  .hrow:hover{background:#fbfcfe}
  .num{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}

  /* 弹窗 */
  .mask{position:fixed;inset:0;background:rgba(16,24,40,.42);display:none;place-items:center;z-index:50}
  .mask.open{display:grid}
  .modal{background:#fff;border-radius:14px;padding:24px;width:380px;box-shadow:0 24px 60px -12px rgba(16,24,40,.4)}
  .modal h3{font-size:16px;margin-bottom:8px}
  .modal .row{margin-top:20px;justify-content:flex-end}

  /* 面包屑 */
  .crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:12px}
  .crumb a{color:var(--accent)}

  .note{margin-top:28px;border-top:1px dashed #cfd6e2;padding-top:12px;color:var(--muted);font-size:12px}
  @media(max-width:860px){
    .g3,.g2,.me{grid-template-columns:1fr}
    .side{position:static;display:flex;gap:6px;overflow:auto}
    .side .grp{display:none}
    nav.main{display:none}
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="mask" id="mask" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script>
const S = { user: "admin", resume: null, sessions: [] };

/* ---------- 顶栏 ---------- */
function nav(active){
  const items = [["#/","工作台","home"],["#/history","练习记录","history"]];
  return `<header class="top"><div class="wrap top-in">
    <a class="logo" href="#/"><b>F</b> Face <small>面试练习室</small></a>
    <nav class="main">${items.map(([h,t,k])=>
      `<a href="${h}" class="${active===k?'on':''}">${t}</a>`).join("")}</nav>
    <div class="right">
      <button class="btn ghost" onclick="go('#/practice/new')">开始练习</button>
      <div class="avatar" onclick="toggleMenu(event)">${S.user[0].toUpperCase()}</div>
      <div class="menu" id="menu">
        <a href="#/me">个人中心</a>
        <a href="#/me/resume">我的简历</a>
        <a href="#/me/settings">系统设置</a>
        <hr>
        <button onclick="confirmLogout()">退出登录</button>
      </div>
    </div>
  </div></header>`;
}
function toggleMenu(e){ e.stopPropagation(); document.getElementById('menu').classList.toggle('open'); }
document.addEventListener('click',()=>document.getElementById('menu')?.classList.remove('open'));

/* ---------- 弹窗 ---------- */
function openModal(html){ document.getElementById('modal').innerHTML=html;
  document.getElementById('mask').classList.add('open'); }
function closeModal(){ document.getElementById('mask').classList.remove('open'); }
function confirmLogout(){
  closeModal();
  openModal(`<h3>退出登录？</h3><p>本机管理员账号，退出后需要重新输入密码。</p>
    <div class="row"><button class="btn" onclick="closeModal()">取消</button>
    <button class="btn primary" onclick="go('#/login')">退出</button></div>`);
}
function confirmDeleteResume(){
  openModal(`<h3>删除这份简历？</h3><p>删除后需要重新上传。已有练习记录不会受影响。</p>
    <div class="row"><button class="btn" onclick="closeModal()">取消</button>
    <button class="btn danger" onclick="S.resume=null;closeModal();go('#/me/resume');render()">删除</button></div>`);
}

/* ---------- 页面 ---------- */
function Login(){
  return `<div style="min-height:100vh;display:grid;place-items:center;padding:24px">
    <div class="card" style="width:380px">
      <div class="logo" style="margin-bottom:8px"><b>F</b> Face</div>
      <h1 style="font-size:22px">面试练习室</h1>
      <p class="lead" style="margin-bottom:20px">本机管理员登录。不开放注册。</p>
      <div class="field"><label class="f">用户名</label><input type="text" value="admin"></div>
      <div class="field"><label class="f">密码</label><input type="password" value="••••••••"></div>
      <button class="btn primary" style="width:100%;justify-content:center" onclick="go('#/')">登录</button>
      <p class="muted" style="margin-top:14px">仅本机运行，账号与数据都在你自己的电脑上。</p>
    </div></div>`;
}

function Dashboard(){
  const empty = !S.resume;
  return `${nav('home')}<main><div class="wrap">
    <h1>${empty ? "先建一份简历，再从第一题开始。" : "今天练一场？"}</h1>
    <p class="lead">${empty
      ? "练习题目会围绕你的简历展开，所以需要先有一份。大约 2 分钟。"
      : "10 道题：5 道八股 + 5 道简历拷打。中途关掉也能接着答。"}</p>

    <section class="hero">
      <div class="spread">
        <div>
          <h2>${empty ? "创建简历" : "开始新练习"}</h2>
          <p>${empty ? "支持 PDF、图片或直接粘贴文字。" : "配置岗位与权重，系统按权重出题。"}</p>
        </div>
        <div class="row">
          ${empty
            ? `<button class="btn primary" onclick="go('#/me/resume')">去创建简历</button>`
            : `<button class="btn primary" onclick="go('#/practice/new')">开始新练习</button>
               <button class="btn" onclick="go('#/practice/1')">继续上次 · 第 3/10 题</button>`}
        </div>
      </div>
    </section>

    <div class="grid g3" style="margin-bottom:16px">
      <div class="stat"><span class="muted">我的简历</span>
        <b style="font-size:16px">${empty ? "未创建" : "2 / 3 份"}</b>
        <a class="muted" href="#/me/resume">${empty ? "去创建 →" : "查看与维护 →"}</a></div>
      <div class="stat"><span class="muted">最近得分</span>
        <b>78.4</b><a class="muted" href="#/practice/1/report">查看报告 →</a></div>
      <div class="stat"><span class="muted">累计练习</span>
        <b>7 次</b><a class="muted" href="#/history">查看记录 →</a></div>
    </div>

    <div class="card">
      <div class="spread" style="margin-bottom:6px">
        <h2>最近练习</h2><a class="muted" href="#/history">全部记录 →</a>
      </div>
      <div class="list">
        ${[["11-03 09:41","前端 · 10 题","已完成","#/practice/1/report"],
           ["11-02 22:10","前端 · 6/10","未完成","#/practice/1"],
           ["11-01 19:22","后端 · 10 题","已完成","#/practice/1/report"]]
          .map(([d,m,s,h])=>`<a class="item" href="${h}">
            <span class="dot ${s==='已完成'?'on':''}"></span>
            <div style="flex:1"><h3>${m}</h3><p class="muted">${d}</p></div>
            <span class="pill ${s==='已完成'?'ok':'warn'}">${s}</span><span class="muted">打开 →</span></a>`).join("")}
      </div>
    </div>
  </div></main>`;
}

function Setup(){
  const pools=[["JavaScript",30],["Vue",20],["React",20],["计算机网络",20],["前端工程化",10]];
  return `${nav('none')}<main><div class="wrap">
    <div class="crumb"><a href="#/">工作台</a> / 新练习</div>
    <h1>配置这一场</h1><p class="lead">权重决定题目从哪些方向抽，不是题量。共 10 题。</p>
    <div class="grid g2">
      <div class="card">
        <h2 style="margin-bottom:14px">方向权重</h2>
        ${pools.map(([n,v])=>`<div class="wrow"><span>${n}</span>
          <input type="range" min="0" max="30" value="${v}" oninput="this.nextElementSibling.textContent=this.value">
          <b>${v}</b></div>`).join("")}
        <div class="divider"></div>
        <p class="muted">当前配置预计出题：JavaScript 1 · Vue 1 · 网络 1 · React 1 · 工程化 1</p>
      </div>
      <div>
        <div class="card" style="margin-bottom:16px">
          <h2>本场设置</h2>
          <div class="field" style="margin-top:12px"><label class="f">岗位</label>
            <input type="text" value="前端工程师"></div>
          <div class="field"><label class="f">简历</label>
            <select><option>张_前端工程师_2026.pdf · 前端（默认）</option><option>张_Java后端_2026.pdf · Java 后端</option></select></div>
          <div class="field"><label class="f">顺序</label>
            <select><option>八股与拷打交替</option><option>先 5 八股再 5 拷打</option></select></div>
          <button class="btn primary" style="width:100%;justify-content:center"
            onclick="go('#/practice/1')">生成题目并开始</button>
        </div>
        <div class="card" style="background:#fbfcfd">
          <h3>不打算改？</h3><p class="muted" style="margin-top:6px">
          直接开始会沿用上次的权重。</p>
          <button class="btn" style="margin-top:10px;width:100%;justify-content:center"
            onclick="go('#/practice/1')">沿用上次配置</button>
        </div>
      </div>
    </div>
  </div></main>`;
}

function Answer(){
  return `${nav('none')}<main><div class="wrap">
    <div class="crumb"><a href="#/">工作台</a> / <a href="#/history">练习记录</a> / 本次练习</div>
    <div class="card">
      <div class="qhead">
        <span class="pill blue">第 3 / 10 题</span>
        <span class="pill">Vue · 中等</span>
        <div class="progress"><i style="width:30%"></i></div>
        <span class="muted">00:42</span>
      </div>
      <div class="qtext">Vue 3 为什么改用 Proxy 实现响应式？它解决了 Vue 2 的哪些问题？</div>
      <p class="muted" style="margin-bottom:12px">口头作答的题目，这里先把思路写下来也可以。</p>
      <textarea placeholder="写下你的回答…">Proxy 拦截整个对象的读写，新增、删除属性都能被捕获，不用再写 $set。Vue 2 用 defineProperty 只能劫持已有属性……</textarea>
      <div class="spread" style="margin-top:16px">
        <button class="btn ghost">跳过这题</button>
        <div class="row">
          <button class="btn">上一题</button>
          <button class="btn primary" onclick="go('#/practice/1/report')">下一题</button>
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>这题在考什么</h3>
      <p class="muted" style="margin-top:6px">Proxy 的拦截能力 · 惰性代理时机 · 不兼容 IE 的代价</p>
      <p class="muted" style="margin-top:8px">题目来自：Vue 池（seed 占位题库，质量未校验）</p>
    </div>
  </div></main>`;
}

function Report(){
  const dims=[["内容质量",82],["表达流畅",74],["口头禅",90],["简历追问",68],["岗位匹配",80]];
  return `${nav('none')}<main><div class="wrap">
    <div class="crumb"><a href="#/history">练习记录</a> / 本场报告</div>
    <div class="card" style="margin-bottom:16px">
      <div class="spread">
        <div class="row" style="align-items:flex-end;gap:16px">
          <span class="score">78.4</span>
          <div style="padding-bottom:6px">
            <span class="pill ok">良好</span>
            <p class="muted" style="margin-top:6px">覆盖率 89% · 样本充足，输出点值</p>
          </div>
        </div>
        <div class="row">
          <button class="btn">导出 JSON</button>
          <button class="btn primary" onclick="go('#/practice/new')">再练一场</button>
        </div>
      </div>
      <div class="divider"></div>
      <p class="muted">动作表现维度在 1.0 未启用，不计入总分。本题库为占位数据，质量未人工校验。</p>
    </div>
    <div class="grid g2" style="margin-bottom:16px">
      <div class="card">
        <h2 style="margin-bottom:10px">维度得分</h2>
        ${dims.map(([n,v])=>`<div class="dim"><span class="muted">${n}</span>
          <div class="bar"><i style="width:${v}%"></i></div><b>${v}</b></div>`).join("")}
        <div class="dim"><span class="muted">动作表现</span>
          <div class="bar"><i class="off" style="width:100%"></i></div><span class="muted">未启用</span></div>
      </div>
      <div class="card">
        <h2 style="margin-bottom:10px">扣分（3 处）</h2>
        <div class="dedu"><div class="t"><span>口头禅密度超标</span><b style="color:#b42318">扣 3</b></div>
          <div class="e">00:12.8 · 7.2 次/分 &gt; 阈值 6.0<br>「额……那个，我当时主要是负责这个模块」</div></div>
        <div class="dedu"><div class="t"><span>只复述概念，无具体案例</span><b style="color:#b42318">扣 8</b></div>
          <div class="e">「Proxy 就是比 defineProperty 更好用」</div></div>
        <div class="dedu"><div class="t"><span>简历疑点未澄清</span><b style="color:#b42318">扣 6</b></div>
          <div class="e">第 8 题 · 「性能提升 300%」未说明基线</div></div>
      </div>
    </div>
    <div class="card">
      <h2 style="margin-bottom:10px">逐题回顾</h2>
      <div class="list">
        ${[["第 3 题","Vue 3 Proxy","71"],["第 4 题","性能优化实践","88"],["第 8 题","简历：性能提升 300%","58"]]
          .map(([n,q,s])=>`<a class="item" href="#/practice/1">
            <span class="num">${n}</span><div style="flex:1"><h3>${q}</h3></div>
            <b>${s}</b><span class="muted">展开 →</span></a>`).join("")}
      </div>
    </div>
  </div></main>`;
}

function History(){

/* ---------- 个人中心 ---------- */
function meShell(active, inner){
  const link=(h,t,k)=>`<a href="${h}" class="${active===k?'on':''}">${t}</a>`;
  return `${nav('none')}<main><div class="wrap me">
    <aside class="side">
      ${link("#/me","概览","overview")}
      <div class="grp">我的资料</div>
      ${link("#/me/resume","我的简历","resume")}
      <div class="grp">偏好</div>
      ${link("#/me/settings","系统设置","settings")}
    </aside>
    <div>${inner}</div>
  </div></main>`;
}

/* 模拟上传 */
function upload(){
  S.resume = true;
  openModal(`<h3>上传简历</h3>
    <p style="margin:10px 0">选择 PDF / 图片，或直接粘贴文字。</p>
    <div class="empty" style="padding:26px;margin-top:8px">拖入文件，或点击选择</div>
    <p class="muted" style="margin-top:12px">上传前会提示先对手机号、身份证号打码。</p>
    <div class="row"><button class="btn" onclick="closeModal()">取消</button>
    <button class="btn primary" onclick="closeModal();S.resume=true;go('#/me/resume');render()">完成（示例）</button></div>`);
}

/* ---------- 路由 ---------- */
const routes = {
  "#/login": Login,
  "#/": Dashboard,
  "#/practice/new": Setup,
  "#/practice/1": Answer,
  "#/practice/1/report": Report,
  "#/history": History,
  "#/me": MeOverview,
  "#/me/resume": MeResume,
  "#/me/settings": MeSettings,
};
function go(hash){ location.hash = hash; }
function render(){
  const h = location.hash || "#/";
  const view = routes[h] || Dashboard;
  document.getElementById("app").innerHTML = view();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", render);
render();
</script>
